{% extends 'base.html' %}

{% block title %}{{ error_code }} - {{ error_title }} - MICKY FF ARENA{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; padding: 60px 20px; text-align: center;">
  <div class="panel error-box {% if error_code == 404 %}status-404{% else %}status-500{% endif %}">
    <div class="error-code-display">
      {{ error_code }}
    </div>
    
    <h2 style="margin-bottom: 12px; font-family: var(--font-display); letter-spacing: 1px;">
      {{ error_title }}
    </h2>

    <p style="color: var(--muted); font-size: 15px; margin-bottom: 28px; line-height: 1.6;">
      {{ error_message }}
    </p>

    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Return to Main Arena
      </a>
      <a href="{{ url_for('main.support') }}" class="btn btn-outline">
        <i class="fa-solid fa-headset"></i> Contact Support
      </a>
    </div>
  </div>
</div>
{% endblock %}
