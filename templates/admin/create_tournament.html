{% extends 'admin/base_admin.html' %}

{% block admin_content %}
<div style="max-width: 900px;">
  <div class="section-header">
    <div class="section-title">
      <i class="fa-solid fa-plus-circle text-acid"></i>
      <div>
        <small>NEW BRACKET INITIALIZATION</small>
        <h2>Create Tournament</h2>
      </div>
    </div>
    <a href="{{ url_for('admin.tournaments') }}" class="btn btn-outline btn-sm">
      <i class="fa-solid fa-arrow-left"></i> Back to Tournaments
    </a>
  </div>

  <div class="panel">
    <form method="POST" action="{{ url_for('admin.create_tournament') }}">
      
      <div class="form-group">
        <label for="name">Tournament Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" placeholder="e.g. Bermuda Blitz Championship S5" required maxlength="150">
      </div>

      <div class="form-group">
        <label for="banner">Banner Image URL</label>
        <input type="text" id="banner" name="banner" placeholder="https://example.com/banner.jpg">
        <div class="form-helper">Direct image link (Unsplash, Imgur, or CDN URL)</div>
      </div>

      <div class="form-group">
        <label for="description">Short Description</label>
        <textarea id="description" name="description" rows="3" placeholder="Brief summary of this tournament's format, eligibility, and prize prestige..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="date">Match Date <span class="required">*</span></label>
          <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
          <label for="time">Kickoff Time <span class="required">*</span></label>
          <input type="time" id="time" name="time" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="entry_fee">Entry Fee (₹)</label>
          <input type="number" id="entry_fee" name="entry_fee" min="0" step="1" value="0">
          <div class="form-helper">Enter 0 for Free Tournaments</div>
        </div>

        <div class="form-group">
          <label for="prize_pool">Total Prize Pool (₹)</label>
          <input type="number" id="prize_pool" name="prize_pool" min="0" step="100" value="10000">
        </div>

        <div class="form-group">
          <label for="max_teams">Maximum Squads</label>
          <input type="number" id="max_teams" name="max_teams" min="2" max="100" value="48">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="game_mode">Game Mode</label>
          <select id="game_mode" name="game_mode">
            <option value="Squad" selected>Squad (4v4v4...)</option>
            <option value="Duo">Duo (2v2v2...)</option>
            <option value="Solo">Solo (Battle Royale)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="map">Map</label>
          <select id="map" name="map">
            <option value="Bermuda" selected>Bermuda</option>
            <option value="Purgatory">Purgatory</option>
            <option value="Kalahari">Kalahari</option>
            <option value="Alpine">Alpine</option>
            <option value="NexTerra">NexTerra</option>
          </select>
        </div>

        <div class="form-group">
          <label for="status">Initial Status</label>
          <select id="status" name="status">
            <option value="REGISTRATION OPEN" selected>REGISTRATION OPEN</option>
            <option value="UPCOMING">UPCOMING (Announced)</option>
            <option value="LIVE">LIVE NOW</option>
            <option value="COMPLETED">COMPLETED</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="rules">Official Rules & Guidelines</label>
        <textarea id="rules" name="rules" rows="5">1. Mobile devices only (strict ban on PC emulators).
2. Captains must record end-game scoreboard or screenshot.
3. Custom room unlocks 15 minutes before match kickoff.
4. Unsportsmanlike conduct or third-party tools will forfeit all prizes.</textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
        <i class="fa-solid fa-floppy-disk"></i> Save & Publish Tournament
      </button>
    </form>
  </div>
</div>
{% endblock %}
