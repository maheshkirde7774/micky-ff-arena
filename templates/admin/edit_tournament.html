{% extends 'admin/base_admin.html' %}

{% block admin_content %}
<div style="max-width: 900px;">
  <div class="section-header">
    <div class="section-title">
      <i class="fa-solid fa-pen-to-square text-acid"></i>
      <div>
        <small>MODIFY TOURNAMENT #{{ tournament.id }}</small>
        <h2>Edit Tournament</h2>
      </div>
    </div>
    <a href="{{ url_for('admin.tournaments') }}" class="btn btn-outline btn-sm">
      <i class="fa-solid fa-arrow-left"></i> Back to Tournaments
    </a>
  </div>

  <div class="panel">
    <form method="POST" action="{{ url_for('admin.edit_tournament', tournament_id=tournament.id) }}">
      
      <div class="form-group">
        <label for="name">Tournament Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" value="{{ tournament.name }}" required maxlength="150">
      </div>

      <div class="form-group">
        <label for="banner">Banner Image URL</label>
        <input type="text" id="banner" name="banner" value="{{ tournament.banner or '' }}">
      </div>

      <div class="form-group">
        <label for="description">Short Description</label>
        <textarea id="description" name="description" rows="3">{{ tournament.description }}</textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="date">Match Date <span class="required">*</span></label>
          <input type="date" id="date" name="date" value="{{ tournament.date }}" required>
        </div>

        <div class="form-group">
          <label for="time">Kickoff Time <span class="required">*</span></label>
          <input type="time" id="time" name="time" value="{{ tournament.time }}" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="entry_fee">Entry Fee (₹)</label>
          <input type="number" id="entry_fee" name="entry_fee" min="0" step="1" value="{{ tournament.entry_fee|int }}">
        </div>

        <div class="form-group">
          <label for="prize_pool">Total Prize Pool (₹)</label>
          <input type="number" id="prize_pool" name="prize_pool" min="0" step="100" value="{{ tournament.prize_pool|int }}">
        </div>

        <div class="form-group">
          <label for="max_teams">Maximum Squads</label>
          <input type="number" id="max_teams" name="max_teams" min="2" max="100" value="{{ tournament.max_teams }}">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="game_mode">Game Mode</label>
          <select id="game_mode" name="game_mode">
            <option value="Squad" {% if tournament.game_mode == 'Squad' %}selected{% endif %}>Squad</option>
            <option value="Duo" {% if tournament.game_mode == 'Duo' %}selected{% endif %}>Duo</option>
            <option value="Solo" {% if tournament.game_mode == 'Solo' %}selected{% endif %}>Solo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="map">Map</label>
          <select id="map" name="map">
            <option value="Bermuda" {% if tournament.map == 'Bermuda' %}selected{% endif %}>Bermuda</option>
            <option value="Purgatory" {% if tournament.map == 'Purgatory' %}selected{% endif %}>Purgatory</option>
            <option value="Kalahari" {% if tournament.map == 'Kalahari' %}selected{% endif %}>Kalahari</option>
            <option value="Alpine" {% if tournament.map == 'Alpine' %}selected{% endif %}>Alpine</option>
            <option value="NexTerra" {% if tournament.map == 'NexTerra' %}selected{% endif %}>NexTerra</option>
          </select>
        </div>

        <div class="form-group">
          <label for="status">Tournament Status</label>
          <select id="status" name="status">
            <option value="REGISTRATION OPEN" {% if tournament.status == 'REGISTRATION OPEN' %}selected{% endif %}>REGISTRATION OPEN</option>
            <option value="UPCOMING" {% if tournament.status == 'UPCOMING' %}selected{% endif %}>UPCOMING</option>
            <option value="FULL" {% if tournament.status == 'FULL' %}selected{% endif %}>FULL</option>
            <option value="LIVE" {% if tournament.status == 'LIVE' %}selected{% endif %}>LIVE NOW</option>
            <option value="COMPLETED" {% if tournament.status == 'COMPLETED' %}selected{% endif %}>COMPLETED</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="rules">Official Rules & Guidelines</label>
        <textarea id="rules" name="rules" rows="5">{{ tournament.rules }}</textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
        <i class="fa-solid fa-floppy-disk"></i> Update Tournament Settings
      </button>
    </form>
  </div>
</div>
{% endblock %}
